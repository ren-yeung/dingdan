name = "yijia-erp"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2024-11-01"

# 本地开发 / wrangler 直接部署用。Git 自动部署时，D1/R2 绑定请在 Cloudflare 控制台配置。
[[d1_databases]]
binding = "DB"
database_name = "yijia-erp-db"
# 本地开发可保留此占位；生产 Git 部署请在 Cloudflare 控制台创建 D1 并绑定到本 Pages 项目
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yijia-erp-uploads"

[vars]
# 生产环境请改为随机长字符串（也可在 Cloudflare 控制台设 JWT_SECRET）
JWT_SECRET = "change-this-to-a-random-string"
