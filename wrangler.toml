name = "yijia-erp"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2024-11-01"

# Cloudflare Pages（Git 部署）会读取本文件的绑定配置。
# D1 / R2 为公开资源标识，写在这里；JWT_SECRET 也可在
# 控制台 Settings → Variables 设加密变量覆盖本值。

[[d1_databases]]
binding = "DB"
database_name = "yijia-erp-db"
database_id = "e3beec90-83bc-47a2-bc5e-09fe131634ff"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yijia-erp-uploads"

[vars]
JWT_SECRET = "5f863cc9d8a81d3a97f7a02416d089c54a37342cf7a8269045f326b5e187f248"

# 定时任务（付款提醒）说明：
# Pages Functions 不支持原生 Cron，做法是后端暴露 POST /api/cron/check-payments
# （需带 Authorization: Bearer <CRON_SECRET>），由 GitHub Actions / cron-job.org 每天调用。
# 以下两个密钥请在 Cloudflare 控制台 Settings → Environment variables 配置：
#   PUSHPLUS_TOKEN = PushPlus 用户 Token（发微信用）
#   CRON_SECRET    = 任意随机串，作为接口调用口令（与 GitHub Actions secret 保持一致）
