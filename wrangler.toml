name = "yijia-erp"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2024-11-01"

# ── 重要 ───────────────────────────────────────────────
# Git 自动部署（Cloudflare Pages）时，D1 / R2 / JWT_SECRET
# 请全部在 Cloudflare 控制台绑定/设置，不要写死在这里：
#   Pages 项目 → Settings → Functions → Bindings（绑定 DB→D1、BUCKET→R2）
#   Pages 项目 → Settings → Variables（设置 JWT_SECRET，加密）
#
# 本地开发：用 `wrangler pages dev frontend/dist`，
#   并在本地 .dev.vars 里提供 JWT_SECRET（D1/R2 用本地配置或真实绑定）。
# ───────────────────────────────────────────────────────
