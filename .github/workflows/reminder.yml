name: 订单付款提醒推送

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，每天推送一次未来7天内到期订单
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # 支持在 Actions 页手动触发测试

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 调用付款提醒接口
        run: |
          curl -s -X POST "${{ secrets.REMINDER_URL }}" \
            -H "Authorization: Bearer ${{ secrets.REMINDER_SECRET }}" \
            -H "Content-Type: application/json"
