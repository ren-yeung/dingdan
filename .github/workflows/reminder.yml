name: 订单付款提醒推送

on:
  schedule:
    # 北京时间每天 12:20 推送；非整点以规避 GitHub 整点高负载丢弃 scheduled 作业
    - cron: '20 12 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch: {}   # 支持在 Actions 页手动触发测试

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 调用付款提醒接口
        run: |
          curl -f -s -X POST "${{ secrets.REMINDER_URL }}" \
            -H "Authorization: Bearer ${{ secrets.REMINDER_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n[HTTP %{http_code}]\n"
