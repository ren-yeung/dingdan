name: 订单付款提醒推送

on:
  schedule:
    # UTC 02:00 = 北京时间 10:00，每天推送一次（前后15天待付款 / 暂无待付款）
    - cron: '0 2 * * *'
  workflow_dispatch: {}   # 支持在 Actions 页手动触发测试

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 调用付款提醒接口
        run: |
          curl -f -s -X POST "${{ secrets.REMINDER_URL }}" \
            -H "Authorization: Bearer ${{ secrets.REMINDER_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n[HTTP %{http_code}]\n"
